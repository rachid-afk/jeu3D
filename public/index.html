<!DOCTYPE html><html><head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;overflow:hidden;font-family:sans-serif;color:#fff}
#hud{position:fixed;top:8px;left:0;right:0;text-align:center;font-size:18px;text-shadow:0 0 4px #000}
#msg{font-size:36px;font-weight:bold;height:46px}
#grid{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:grid;grid-template-columns:repeat(3,84px);gap:8px}
#grid button{height:64px;font-size:24px;border:0;border-radius:12px;background:#ffffffcc}
#grid button:disabled{opacity:.3}
</style></head><body>
<div id="hud"><div id="score">Connexion...</div><div id="info"></div><div id="msg"></div></div>
<div id="grid"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
const $=id=>document.getElementById(id);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x87ceeb);
const cam=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,200);
cam.position.set(0,1.6,5);cam.lookAt(0,1.2,-11);
const rd=new THREE.WebGLRenderer({antialias:true});
rd.setSize(innerWidth,innerHeight);document.body.appendChild(rd.domElement);
addEventListener('resize',()=>{rd.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});
scene.add(new THREE.HemisphereLight(0xffffff,0x555555,1.1));
const sun=new THREE.DirectionalLight(0xffffff,.6);sun.position.set(5,10,5);scene.add(sun);
const pitch=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshLambertMaterial({color:0x2e8b3a}));
pitch.rotation.x=-Math.PI/2;pitch.position.z=-10;scene.add(pitch);
const white=new THREE.MeshLambertMaterial({color:0xffffff});
function box(w,h,d,x,y,z,m){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m||white);o.position.set(x,y,z);scene.add(o);return o}
box(.12,2.44,.12,-3.66,1.22,-11);box(.12,2.44,.12,3.66,1.22,-11);box(7.44,.12,.12,0,2.44,-11);
box(40,.02,.1,0,.01,-11);box(.3,.02,.3,0,.01,0);
const net=new THREE.Mesh(new THREE.PlaneGeometry(7.32,2.44),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.25,side:THREE.DoubleSide}));
net.position.set(0,1.22,-12.5);scene.add(net);
const keeper=new THREE.Group();
const kc=new THREE.MeshLambertMaterial({color:0xffd400});
const kb=new THREE.Mesh(new THREE.BoxGeometry(.6,1,.3),kc);
const kl=new THREE.Mesh(new THREE.BoxGeometry(.4,.6,.25),new THREE.MeshLambertMaterial({color:0x222222}));kl.position.y=-.8;
const kh=new THREE.Mesh(new THREE.SphereGeometry(.2,16,16),new THREE.MeshLambertMaterial({color:0xf0c8a0}));kh.position.y=.75;
const ka=new THREE.Mesh(new THREE.BoxGeometry(1.5,.15,.15),kc);ka.position.y=.3;
keeper.add(kb,kl,kh,ka);scene.add(keeper);
const ball=new THREE.Mesh(new THREE.SphereGeometry(.11,20,20),new THREE.MeshLambertMaterial({color:0xfafafa,emissive:0x333333}));
scene.add(ball);
const XS=[-2.4,0,2.4],YS=[1.8,.6];
function reset(){ball.position.set(0,.11,0);keeper.position.set(0,1.1,-10.9);keeper.rotation.z=0}
reset();
let anim=null;
function play(sz,kz,goal){anim={t:0,goal,sx:XS[sz%3],sy:YS[Math.floor(sz/3)],kx:XS[kz%3],ky:YS[Math.floor(kz/3)]}}
let last=performance.now();
function loop(now){requestAnimationFrame(loop);
 const dt=(now-last)/1000;last=now;
 if(anim){anim.t+=dt;
  const b=Math.min(anim.t/.7,1),k=Math.min(anim.t/.55,1);
  ball.position.x=anim.sx*b;
  ball.position.z=(anim.goal?-12:-10.6)*b;
  ball.position.y=.11+(anim.sy-.11)*b+Math.sin(b*Math.PI)*.4;
  keeper.position.x=anim.kx*k;
  keeper.position.y=1.1+(anim.ky-1.2)*.35*k;
  keeper.rotation.z=-(anim.kx/2.4)*1.2*k}
 rd.render(scene,cam)}
requestAnimationFrame(loop);
const socket=io();let you=0,locked=true;
const grid=$('grid');
['↖','↑','↗','↙','↓','↘'].forEach((t,i)=>{
 const b=document.createElement('button');b.textContent=t;
 b.onclick=()=>{if(locked)return;setGrid(false);socket.emit('choice',i);$('info').textContent="En attente de l'adversaire..."};
 grid.appendChild(b)});
function setGrid(on){locked=!on;[...grid.children].forEach(b=>b.disabled=!on)}
setGrid(false);
socket.on('wait',()=>{$('score').textContent="Connecté";$('info').textContent="En attente d'un adversaire..."});
socket.on('round',d=>{you=d.you;reset();anim=null;$('msg').textContent='';
 $('score').textContent="Tir "+(d.r+1)+"/"+d.total+" - Toi "+d.score[you]+" : "+d.score[1-you]+" Adversaire";
 $('info').textContent=d.shooter==you?"Tu tires ! Choisis ton coin":"Tu es gardien ! Devine le coin";
 setGrid(true)});
socket.on('result',d=>{play(d.sz,d.kz,d.goal);
 $('msg').textContent=d.goal?"BUT !":"ARRÊT !";
 $('score').textContent="Toi "+d.score[you]+" : "+d.score[1-you]+" Adversaire"});
socket.on('end',d=>{setGrid(false);
 const a=d.score[you],c=d.score[1-you];
 $('msg').textContent=a>c?"Victoire !":(a<c?"Défaite":"Égalité");
 $('info').textContent="Fin du match. Recharge la page pour rejouer."});
socket.on('left',()=>{setGrid(false);$('info').textContent="L'adversaire est parti."});
</script></body></html>
